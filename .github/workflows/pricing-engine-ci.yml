# pricing-engine CI workflow
# Migrated from: services/pricing-engine/azure-pipelines.yml (ADO pipeline ID 101)
name: pricing-engine-ci

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'services/pricing-engine/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/pricing-engine/**'

env:
  BUILD_CONFIGURATION: Release
  ARTIFACT_NAME: pricing-engine-drop

jobs:
  build:
    name: Build pricing-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore services/pricing-engine
      - name: Build
        run: dotnet build services/pricing-engine --configuration "$BUILD_CONFIGURATION" --no-restore
