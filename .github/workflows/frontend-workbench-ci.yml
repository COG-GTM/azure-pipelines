# frontend-workbench-ci CI workflow
# Migrated from: services/frontend-workbench/azure-pipelines.yml (ADO pipeline ID 106)
# Stack: Node.js 18 (React, SSR bundle)
# Original template source: team/frontend-custom branch (alt-templates, owned by team-frontend)
#
# ADO templates inlined:
#   - alt-templates/frontend/frontend-build.yml   (nodeVersion 18.x, framework react, enableSSR true)
#   - alt-templates/frontend/frontend-deploy.yml  (environment dev, then staging; cdnPurge default true)
#
# Variable group frontend-cdn-config (VG 210) is provided per GitHub environment:
#   vars:    CDN_ENDPOINT, CDN_STORAGE_ACCOUNT
#   secrets: CDN_STORAGE_KEY, CDN_PURGE_API_KEY
# See docs/migration/frontend-workbench-ci-ado-to-gha-mapping.md.

name: frontend-workbench-ci

# --- mapped from: trigger.branches / trigger.paths ---
# ADO `feature/*` is single-level; GHA `feature/**` is recursive (intentional broadening).
# pull_request is an addition — the ADO pipeline had no PR trigger.
on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'services/frontend-workbench/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/frontend-workbench/**'

# --- mapped from: variables ---
env:
  ARTIFACT_NAME: frontend-workbench-bundle
  SERVICE_DIR: services/frontend-workbench

defaults:
  run:
    shell: bash

jobs:
  # --- mapped from: stage Build / job build (alt-templates/frontend/frontend-build.yml) ---
  build:
    name: Build frontend-workbench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- mapped from: NodeTool@0 (versionSpec 18.x) ---
      - name: Install Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      # --- mapped from: script `npm ci` ---
      - name: Install dependencies
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm ci

      # --- mapped from: script `npm run lint` ---
      - name: Lint check
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run lint

      # --- mapped from: script `npm run build:${{ parameters.framework }}` (framework=react) ---
      - name: Build react app
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run build:react

      # --- mapped from: `${{ if eq(parameters.enableSSR, true) }}` script `npm run build:ssr` ---
      - name: Build SSR bundle
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm run build:ssr

      # --- mapped from: script `npm test -- --ci --coverage` ---
      - name: Run tests
        working-directory: ${{ env.SERVICE_DIR }}
        run: npm test -- --ci --coverage

      # --- mapped from: ArchiveFiles@2 (rootFolderOrFile build/, includeRootFolder false, zip) ---
      - name: Archive frontend bundle
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/staging
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          (cd build && zip -qr "$BUILD_ARTIFACTSTAGINGDIRECTORY/$ARTIFACT_NAME.zip" .)

      # --- mapped from: script `npx lhci autorun --collect.staticDistDir=build/ || true` ---
      - name: Run Lighthouse CI audit
        working-directory: ${{ env.SERVICE_DIR }}
        run: npx lhci autorun --collect.staticDistDir=build/ || true

      # --- mapped from: PublishBuildArtifacts@1 (artifactName `<name>-$(Build.BuildId)`) ---
      # Workflow artifact only: the ADO source never registers this bundle in Artifactory.
      - name: Upload frontend bundle (GitHub artifact, no Artifactory registration)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging

  # --- mapped from: stage Deploy_Dev (frontend-deploy.yml, environment=dev) ---
  # Deployment jobs are gated to push events so PR builds never touch the dev CDN.
  deploy_dev:
    name: Deploy to dev
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # --- mapped from: deployment job `environment: dev-frontend` ---
    environment: dev-frontend
    env:
      DEPLOY_ENVIRONMENT: dev
      # --- mapped from: variable group frontend-cdn-config ---
      CDN_ENDPOINT: ${{ vars.CDN_ENDPOINT }}
      CDN_STORAGE_ACCOUNT: ${{ vars.CDN_STORAGE_ACCOUNT }}
      CDN_STORAGE_KEY: ${{ secrets.CDN_STORAGE_KEY }}
      CDN_PURGE_API_KEY: ${{ secrets.CDN_PURGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # --- mapped from: `download: current` ---
      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging

      # --- mapped from: script 'Upload to CDN' ---
      - name: Upload to CDN
        run: |
          echo "Uploading static assets to CDN..."
          echo "Environment: $DEPLOY_ENVIRONMENT"

      # --- mapped from: `${{ if eq(parameters.cdnPurge, true) }}` script 'Purge CDN cache' ---
      - name: Purge CDN cache
        run: |
          echo "Purging CDN cache for $DEPLOY_ENVIRONMENT..."

      # --- mapped from: script 'Health check' ---
      # ADO probes the placeholder host <env>.example.com; set the HEALTH_CHECK_URL
      # environment variable to the real endpoint to override it.
      - name: Health check
        env:
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
        run: |
          echo "Verifying deployment health..."
          curl -sf "${HEALTH_CHECK_URL:-https://$DEPLOY_ENVIRONMENT.example.com/health}" || exit 1

      # Not in the ADO source: frontend-deploy.yml has no D2 notify or compliance attestation step.
      # Records what was deployed in the run summary so the gap is visible to reviewers.
      - name: Deployment summary (no D2 notify / compliance attestation in ADO source)
        run: |
          {
            echo "### frontend-workbench deployed to $DEPLOY_ENVIRONMENT"
            echo "- commit: ${{ github.sha }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- mapped from: stage Deploy_Staging (frontend-deploy.yml, environment=staging) ---
  # condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  deploy_staging:
    name: Deploy to staging
    needs: deploy_dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # --- mapped from: deployment job `environment: staging-frontend` (1 team-frontend approver) ---
    environment: staging-frontend
    env:
      DEPLOY_ENVIRONMENT: staging
      # --- mapped from: variable group frontend-cdn-config ---
      CDN_ENDPOINT: ${{ vars.CDN_ENDPOINT }}
      CDN_STORAGE_ACCOUNT: ${{ vars.CDN_STORAGE_ACCOUNT }}
      CDN_STORAGE_KEY: ${{ secrets.CDN_STORAGE_KEY }}
      CDN_PURGE_API_KEY: ${{ secrets.CDN_PURGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # --- mapped from: `download: current` ---
      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging

      # --- mapped from: script 'Upload to CDN' ---
      - name: Upload to CDN
        run: |
          echo "Uploading static assets to CDN..."
          echo "Environment: $DEPLOY_ENVIRONMENT"

      # --- mapped from: `${{ if eq(parameters.cdnPurge, true) }}` script 'Purge CDN cache' ---
      - name: Purge CDN cache
        run: |
          echo "Purging CDN cache for $DEPLOY_ENVIRONMENT..."

      # --- mapped from: script 'Health check' ---
      # ADO probes the placeholder host <env>.example.com; set the HEALTH_CHECK_URL
      # environment variable to the real endpoint to override it.
      - name: Health check
        env:
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
        run: |
          echo "Verifying deployment health..."
          curl -sf "${HEALTH_CHECK_URL:-https://$DEPLOY_ENVIRONMENT.example.com/health}" || exit 1

      # Not in the ADO source: frontend-deploy.yml has no D2 notify or compliance attestation step.
      - name: Deployment summary (no D2 notify / compliance attestation in ADO source)
        run: |
          {
            echo "### frontend-workbench deployed to $DEPLOY_ENVIRONMENT"
            echo "- commit: ${{ github.sha }}"
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
