# portfolio-api-ci CI workflow
# Migrated from: services/portfolio-api/azure-pipelines.yml (ADO pipeline ID 102)
# Stack: Java 17 / Maven
# Original template source: shared-ci-platform @ master (legacy template set)
#
# ADO templates inlined (read from origin/master):
#   - templates/build/build-java.yml        (jdkVersion=17, mavenGoal=package, artifactName=portfolio-api-dist)
#   - templates/release/release-standard.yml (environment=staging, artifactName=portfolio-api-dist)
#
# Behaviour follows the master-branch templates; integration steps use the
# main-branch names (Artifactory / D2 / attestation-database).
# Mapping and known gaps: docs/migration/portfolio-api-ci-ado-to-gha-mapping.md

name: portfolio-api-ci

on:
  # --- mapped from: trigger.branches.include / trigger.paths.include ---
  push:
    branches:
      - main
      - master
    paths:
      - 'services/portfolio-api/**'
      - 'build-tools/scripts/publish_artifact.py'
      - 'build-tools/scripts/notify_release_orchestrator.py'
      - 'build-tools/scripts/generate_attestation.py'
      - '.github/workflows/portfolio-api-ci.yml'
  # Added during migration: ADO pipeline had no PR trigger.
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'services/portfolio-api/**'
      - 'build-tools/scripts/publish_artifact.py'
      - 'build-tools/scripts/notify_release_orchestrator.py'
      - 'build-tools/scripts/generate_attestation.py'
      - '.github/workflows/portfolio-api-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# --- mapped from: variables ---
env:
  ARTIFACT_NAME: portfolio-api-dist
  JDK_VERSION: '17'
  MAVEN_GOAL: package
  MAVEN_OPTIONS: -B -DskipTests=false
  SERVICE_DIR: services/portfolio-api

concurrency:
  group: portfolio-api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- mapped from: stage Build / job build (templates/build/build-java.yml@master) ---
  build:
    name: Build portfolio-api
    runs-on: ubuntu-latest
    outputs:
      has-maven-project: ${{ steps.maven-project.outputs.has_pom }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Maven project
        id: maven-project
        run: |
          if [[ -f "$SERVICE_DIR/pom.xml" ]]; then
            echo "has_pom=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pom=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Maven project found at $SERVICE_DIR/pom.xml; skipping build, artifact upload and deployment."
          fi

      # --- mapped from: JavaToolInstaller@0 (versionSpec=17, x64, PreInstalled) ---
      - name: Install JDK ${{ env.JDK_VERSION }} with Maven cache
        if: steps.maven-project.outputs.has_pom == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
          cache: maven

      - name: Install JDK ${{ env.JDK_VERSION }} without Maven cache
        if: steps.maven-project.outputs.has_pom == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}

      # --- mapped from: Maven@4 (mavenPomFile=pom.xml, goals=package, options=-B -DskipTests=false) ---
      - name: Maven ${{ env.MAVEN_GOAL }}
        if: steps.maven-project.outputs.has_pom == 'true'
        working-directory: ${{ env.SERVICE_DIR }}
        run: mvn -f pom.xml $MAVEN_OPTIONS $MAVEN_GOAL

      # --- mapped from: Maven@4 publishJUnitResults=true, testResultsFiles=**/surefire-reports/TEST-*.xml ---
      - name: Collect JUnit test results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/test-results"
          find "$SERVICE_DIR" -path '*/surefire-reports/TEST-*.xml' -exec cp --parents {} "$RUNNER_TEMP/test-results/" \;
          find "$RUNNER_TEMP/test-results" -type f

      # --- mapped from: Maven@4 publishJUnitResults=true (no native test tab in GHA) ---
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-api-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

      # --- mapped from: script 'Stage build artifacts' ---
      - name: Stage build artifacts
        if: steps.maven-project.outputs.has_pom == 'true'
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          cp target/*.jar "$RUNNER_TEMP/staging/" 2>/dev/null || true
          cp target/*.war "$RUNNER_TEMP/staging/" 2>/dev/null || true

      # --- mapped from: PublishBuildArtifacts@1 (pathToPublish=$(Build.ArtifactStagingDirectory)) ---
      - name: Upload artifacts
        if: steps.maven-project.outputs.has_pom == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/staging
          if-no-files-found: error

      # --- mapped from: script 'Register artifact in artifact-registry' (master) -> Artifactory (main naming) ---
      - name: Register artifact in Artifactory
        if: github.event_name == 'push' && steps.maven-project.outputs.has_pom == 'true'
        env:
          BUILD_SOURCEBRANCH: ${{ github.ref }}
          BUILD_SOURCEVERSION: ${{ github.sha }}
          AGENT_NAME: ${{ runner.name }}
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/staging
        run: |
          python3 build-tools/scripts/publish_artifact.py \
            --name "$ARTIFACT_NAME" \
            --registry Artifactory \
            --build-id "${{ github.run_id }}"

  # --- mapped from: stage Release / Deploy_staging (templates/release/release-standard.yml@master) ---
  deploy-staging:
    name: Deploy to staging
    needs: build
    # ADO deployment job ran on every successful build (requireApproval=false => no branch condition).
    # Restricted to push events so PR builds never deploy or notify.
    if: github.event_name == 'push' && needs.build.outputs.has-maven-project == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- mapped from: download: current, artifact: portfolio-api-dist ---
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/staging

      # --- mapped from: script 'Execute deployment' ---
      - name: Execute deployment
        run: |
          echo "Deploying $ARTIFACT_NAME to staging"
          echo "Strategy: rolling"

      # --- mapped from: script 'Notify release-orchestrator' (master) -> Notify D2 (main naming) ---
      - name: Notify D2
        env:
          BUILD_REQUESTEDFOR: ${{ github.actor }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 build-tools/scripts/notify_release_orchestrator.py \
            --service "$ARTIFACT_NAME" \
            --env staging \
            --build-id "${{ github.run_id }}" \
            --status success

      # --- mapped from: script 'Generate compliance attestation' (compliance-store on master -> attestation-database on main) ---
      - name: Generate compliance attestation
        env:
          BUILD_SOURCEBRANCH: ${{ github.ref }}
          BUILD_SOURCEVERSION: ${{ github.sha }}
          BUILD_DEFINITIONNAME: ${{ github.workflow }}
          AGENT_OS: ${{ runner.os }}
          BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ runner.temp }}/attestation
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          python3 build-tools/scripts/generate_attestation.py \
            --artifact "$ARTIFACT_NAME" \
            --env staging \
            --build-id "${{ github.run_id }}"

      - name: Upload attestation
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-api-staging-attestation
          path: ${{ runner.temp }}/attestation
