# market-sim-ci CI workflow
# Migrated from: services/market-sim/azure-pipelines.yml (ADO pipeline ID 108)
# Stack: Rust (stable toolchain via rustup)
# Original template source: none (inline) — Category 4 custom inline pipeline
#
# ADO templates inlined:
#   - none (the ADO pipeline uses no shared templates; templates/build/build-rust.yml
#     exists in this repo but is NOT consumed by pipeline 108 and is intentionally not inlined)
#
# Mapping document: docs/migration/market-sim-ci-ado-to-gha-mapping.md
name: market-sim-ci

on:
  # --- mapped from: trigger.branches.include [main] + trigger.paths.include [services/market-sim/**] ---
  push:
    branches:
      - main
    paths:
      - 'services/market-sim/**'
      - '.github/workflows/market-sim-ci.yml'
  # Added during migration (ADO pipeline had no PR trigger) for earlier CI feedback.
  pull_request:
    branches:
      - main
    paths:
      - 'services/market-sim/**'
      - '.github/workflows/market-sim-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# --- mapped from: variables ---
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: market-sim-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- mapped from: stage Build ("Build market-sim") / job build_rust ("Rust build") ---
  build:
    name: Build market-sim
    # --- mapped from: pool.vmImage ubuntu-latest ---
    runs-on: ubuntu-latest
    # --- mapped from: timeoutInMinutes: 30 ---
    timeout-minutes: 30
    defaults:
      run:
        # --- mapped from: workingDirectory: services/market-sim (on every cargo step) ---
        working-directory: services/market-sim
    steps:
      # --- mapped from: implicit ADO checkout ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- mapped from: script 'Install Rust' (rustup + ##vso[task.prependpath]) ---
      - name: Install Rust
        working-directory: ${{ github.workspace }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # --- mapped from: script 'Fetch dependencies' ---
      - name: Fetch dependencies
        run: cargo fetch

      # --- mapped from: script 'Lint with clippy' ---
      - name: Lint with clippy
        run: cargo clippy -- -D warnings

      # --- mapped from: script 'Build release binary' ---
      - name: Build release binary
        run: cargo build --release

      # --- mapped from: script 'Run tests' ---
      - name: Run tests
        run: cargo test -- --test-threads=1

      # --- mapped from: script 'Stage binary' ($(Build.ArtifactStagingDirectory) → $RUNNER_TEMP/staging) ---
      - name: Stage binary
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          cp target/release/market-sim "$RUNNER_TEMP/staging/"

      # --- mapped from: PublishBuildArtifacts@1 (artifactName: market-sim-binary) ---
      - name: Publish market-sim binary
        uses: actions/upload-artifact@v4
        with:
          name: market-sim-binary
          path: ${{ runner.temp }}/staging
          if-no-files-found: error

  # --- mapped from: stage Deploy ("Deploy market-sim"), dependsOn Build ---
  deploy:
    name: Deploy market-sim
    runs-on: ubuntu-latest
    needs: build
    # --- mapped from: condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main')) ---
    # `succeeded()` is implied by `needs`; push-only guard added so PR builds never reach deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # --- mapped from: implicit ADO checkout ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- mapped from: script 'Deploy to cluster' ---
      # Replicated verbatim. The ADO stage is an echo only; the real deploy mechanism for the
      # compute cluster ("managed outside D2") is undocumented and must be confirmed with team-quant.
      - name: Deploy to cluster
        run: |
          echo "Deploying market-sim to compute cluster..."
          echo "This deployment is managed outside D2"
