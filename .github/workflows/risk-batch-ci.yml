# risk-batch-ci
# Migrated from: services/risk-batch/azure-pipelines.yml (ADO pipeline ID 104)
# Stack: Python 3.11/pytest
# Original template source: shared-ci-platform @ staging/preprod
#
# Inlined templates:
#   - templates/build/build-python.yml
#   - templates/test/run-tests.yml
#   - templates/release/release-standard.yml
#
# services/risk-batch/pipeline-fragments/build-python-local.yml is an
# unreferenced local fork and is intentionally not migrated.
# Mapping: docs/migration/risk-batch-ci-ado-to-gha-mapping.md
# The pull_request, workflow_dispatch, workflow-file, and helper-script path
# triggers are intentional additions to the ADO push-only trigger.
name: risk-batch-ci

on:
  push:
    branches:
      - main
    paths:
      - 'services/risk-batch/**'
      - '.github/workflows/risk-batch-ci.yml'
      - 'build-tools/scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/risk-batch/**'
      - '.github/workflows/risk-batch-ci.yml'
      - 'build-tools/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risk-batch-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ARTIFACT_NAME: risk-batch-dist
  PYTHON_VERSION: '3.11'
  REQUIREMENTS_FILE: services/risk-batch/requirements.txt
  TEST_RETRY_COUNT: '3'
  BUILD_SOURCEBRANCH: ${{ github.ref }}
  BUILD_SOURCEVERSION: ${{ github.sha }}
  BUILD_BUILDID: ${{ github.run_id }}
  BUILD_DEFINITIONNAME: ${{ github.workflow }}
  BUILD_REQUESTEDFOR: ${{ github.actor }}
  PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  build:
    name: Build risk-batch
    runs-on: ubuntu-latest
    defaults:
      run:
        # The ADO template assumed repository-root execution. The service code is
        # under services/risk-batch, so root-relative inputs use GITHUB_WORKSPACE.
        working-directory: services/risk-batch
    steps:
      # --- mapped from: checkout (implicit ADO source checkout) (build-python.yml) ---
      - name: Checkout
        uses: actions/checkout@v4

      # ADO agents pre-create Build.ArtifactStagingDirectory; GHA runners do not.
      # --- mapped from: Build.ArtifactStagingDirectory setup (ADO agent) (build-python.yml) ---
      - name: Create artifact staging directory
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          echo "BUILD_ARTIFACTSTAGINGDIRECTORY=$RUNNER_TEMP/staging" >> "$GITHUB_ENV"

      # --- mapped from: UsePythonVersion@0 (build-python.yml) ---
      - name: Use Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --- mapped from: Install dependencies (build-python.yml) ---
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r "$GITHUB_WORKSPACE/$REQUIREMENTS_FILE"

      # --- mapped from: Run linting checks (build-python.yml) ---
      - name: Run linting checks
        run: |
          pip install flake8 black mypy
          flake8 src/ --max-line-length=120
          black --check src/

      # The two-level retry exists only on staging/preprod: pytest-rerunfailures
      # retries individual tests, while this loop retries the whole suite.
      # --- mapped from: Run tests with coverage (retry-enabled) (build-python.yml) ---
      - name: Run tests with coverage (retry-enabled)
        run: |
          # pytest-junitxml is not on PyPI (verified 404); JUnit XML is built into pytest.
          pip install pytest pytest-cov pytest-rerunfailures
          RETRY=0
          MAX_RETRY="$TEST_RETRY_COUNT"
          until pytest tests/ --junitxml="$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results.xml" --cov=src/ --cov-report=xml:"$BUILD_ARTIFACTSTAGINGDIRECTORY/coverage.xml" --reruns 2 --reruns-delay 5; do
            RETRY=$((RETRY+1))
            if [ "$RETRY" -ge "$MAX_RETRY" ]; then
              echo "Tests failed after $MAX_RETRY retries"
              exit 1
            fi
            echo "Test retry $RETRY of $MAX_RETRY..."
            sleep 10
          done

      # GHA has no native test tab; upload the JUnit XML as an artifact.
      # --- mapped from: PublishTestResults@2 (build-python.yml) ---
      - name: Publish test results (build)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-batch-build-test-results
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/test-results.xml
          if-no-files-found: warn

      # --- mapped from: Build distribution (build-python.yml) ---
      - name: Build distribution
        run: |
          python setup.py sdist bdist_wheel
          cp -r dist/ "$BUILD_ARTIFACTSTAGINGDIRECTORY/dist/"

      # Keep this before artifact registration and the preprod stamp so the
      # artifact content matches ADO.
      # --- mapped from: PublishBuildArtifacts@1 (build-python.yml) ---
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          if-no-files-found: error

      # --- mapped from: Register artifact in artifact-registry (build-python.yml) ---
      - name: Register artifact in Artifactory (artifact-registry)
        if: github.event_name == 'push'
        env:
          AGENT_NAME: ${{ runner.name }}
        run: |
          python "$GITHUB_WORKSPACE/build-tools/scripts/publish_artifact.py" \
            --name "$ARTIFACT_NAME" \
            --registry artifact-registry \
            --build-id "$BUILD_BUILDID"

      # --- mapped from: Stamp preprod validation marker (build-python.yml) ---
      - name: Stamp preprod validation marker
        run: |
          echo "Preprod artifact validation stamp"
          echo "$BUILD_BUILDID" > "$BUILD_ARTIFACTSTAGINGDIRECTORY/preprod-stamp.txt"

      # --- mapped from: Create test results directory (run-tests.yml) ---
      - name: Create test results directory
        run: mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results"

      # This second, non-retrying pytest pass is pre-existing ADO duplication.
      # --- mapped from: Run pytest (run-tests.yml) ---
      - name: Run pytest
        run: pytest tests/ --junitxml="$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results/results.xml" --tb=short

      # GHA has no native test tab; upload the JUnit XML directory as an artifact.
      # --- mapped from: PublishTestResults@2 (run-tests.yml) ---
      - name: Publish test results (run-tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-batch-test-results
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/test-results
          if-no-files-found: warn

      # --- mapped from: Normalize test results (run-tests.yml) ---
      - name: Normalize test results
        if: always()
        run: |
          python "$GITHUB_WORKSPACE/build-tools/scripts/normalize_test_results.py" \
            --input-dir "$BUILD_ARTIFACTSTAGINGDIRECTORY/test-results" \
            --output "$BUILD_ARTIFACTSTAGINGDIRECTORY/normalized-results.json"

  deploy-dev:
    name: Deploy to dev
    needs: build
    # ADO Release had no condition (requireApproval=false), but ADO only
    # triggered on main pushes; GHA deploys main pushes/manual runs, never PRs.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # ADO deployment jobs do not check out source by default, yet the
      # release template calls $(Build.SourcesDirectory)/build-tools/scripts.
      # GHA checks out explicitly to close that pre-existing ADO gap.
      # --- mapped from: checkout (deployment job default) (release-standard.yml) ---
      - name: Checkout
        uses: actions/checkout@v4

      # Fresh GHA runners do not pre-create the staging directory.
      # --- mapped from: Build.ArtifactStagingDirectory setup (fresh runner) (release-standard.yml) ---
      - name: Create artifact staging directory
        run: |
          mkdir -p "$RUNNER_TEMP/staging"
          echo "BUILD_ARTIFACTSTAGINGDIRECTORY=$RUNNER_TEMP/staging" >> "$GITHUB_ENV"

      # --- mapped from: download: current (release-standard.yml) ---
      - name: Download risk-batch-dist
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/artifacts/risk-batch-dist

      # --- mapped from: Execute deployment (release-standard.yml) ---
      - name: Execute deployment
        run: |
          echo "Deploying $ARTIFACT_NAME to dev"
          echo "Strategy: rolling"

      # --- mapped from: Notify release-orchestrator (release-standard.yml) ---
      - name: Notify release-orchestrator (D2)
        run: |
          python build-tools/scripts/notify_release_orchestrator.py \
            --service "$ARTIFACT_NAME" \
            --env dev \
            --build-id "$BUILD_BUILDID" \
            --status success

      # --- mapped from: Generate compliance attestation (release-standard.yml) ---
      - name: Generate compliance attestation
        env:
          AGENT_OS: ${{ runner.os }}
        run: |
          python build-tools/scripts/generate_attestation.py \
            --artifact "$ARTIFACT_NAME" \
            --env dev \
            --build-id "$BUILD_BUILDID"

      # ADO outputs were only on agent disk; keep them retrievable in GHA.
      # --- mapped from: deployment outputs (release-standard.yml) ---
      - name: Upload deployment attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-batch-dev-attestation
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          if-no-files-found: warn
