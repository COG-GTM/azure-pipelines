# pricing-engine CI workflow
# Migrated from: services/pricing-engine/azure-pipelines.yml (ADO pipeline ID 101)
# ADO stages -> GHA jobs:
#   Build (templates/build/build-dotnet.yml)      -> build
#   Test  (templates/test/run-tests.yml)          -> test
#   Deploy_Dev (templates/release/release-standard.yml) -> deploy_dev
name: pricing-engine-ci

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'services/pricing-engine/**'
  pull_request:
    branches:
      - main
    paths:
      - 'services/pricing-engine/**'

env:
  BUILD_CONFIGURATION: Release
  ARTIFACT_NAME: pricing-engine-drop
  TEST_RESULTS_DIR: ${{ github.workspace }}/artifacts/test-results

jobs:
  build:
    name: Build pricing-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore services/pricing-engine
      - name: Build
        run: dotnet build services/pricing-engine --configuration "$BUILD_CONFIGURATION" --no-restore
      - name: Publish
        run: |
          dotnet publish services/pricing-engine \
            --configuration "$BUILD_CONFIGURATION" \
            --output "${{ github.workspace }}/artifacts/drop"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/drop
      - name: Register artifact in Artifactory
        env:
          ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          python build-tools/scripts/publish_artifact.py \
            --name "$ARTIFACT_NAME" \
            --registry Artifactory \
            --build-id "${{ github.run_id }}"

  test:
    name: Run tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Create test results directory
        run: mkdir -p "$TEST_RESULTS_DIR"
      - name: Run unit tests
        run: |
          dotnet test services/pricing-engine \
            --configuration "$BUILD_CONFIGURATION" \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=results.trx" \
            --results-directory "$TEST_RESULTS_DIR"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-engine-test-results
          path: ${{ env.TEST_RESULTS_DIR }}
      - name: Normalize test results
        if: always()
        run: |
          python build-tools/scripts/normalize_test_results.py \
            --input-dir "$TEST_RESULTS_DIR" \
            --output "${{ github.workspace }}/artifacts/normalized-results.json"

  deploy_dev:
    name: Deploy to dev
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/drop
      - name: Execute deployment
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "Deploying $ARTIFACT_NAME to dev"
          echo "Strategy: rolling"
      - name: Notify D2 release orchestrator
        env:
          D2_API_TOKEN: ${{ secrets.D2_API_TOKEN }}
        run: |
          python build-tools/scripts/notify_release_orchestrator.py \
            --service "$ARTIFACT_NAME" \
            --env dev \
            --build-id "${{ github.run_id }}" \
            --status success
      - name: Generate compliance attestation
        env:
          ATTESTATION_DB_URL: ${{ secrets.ATTESTATION_DB_URL }}
        run: |
          python build-tools/scripts/generate_attestation.py \
            --artifact "$ARTIFACT_NAME" \
            --env dev \
            --build-id "${{ github.run_id }}"
